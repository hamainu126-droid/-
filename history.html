```html
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>日報履歴</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f5f5f5;
}

.header {
  background: #2196F3;
  color: white;
  text-align: center;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
}

.count {
  text-align: center;
  padding: 10px;
  font-size: 13px;
  color: #666;
}

.container {
  padding-bottom: 80px;
}

.card {
  background: white;
  margin: 10px;
  padding: 15px;
  border-radius: 12px;
  box-shadow:
    0 2px 6px
    rgba(0,0,0,0.07);
}

.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  margin-bottom: 8px;
}

.date {
  font-weight: bold;
  font-size: 15px;
}

.status {
  font-size: 12px;
  padding: 4px 8px;
  border-radius: 10px;
  white-space: nowrap;
}

.status-wait {
  background: #fff3cd;
  color: #856404;
}

.status-ok {
  background: #d4edda;
  color: #155724;
}

.status-reject {
  background: #f8d7da;
  color: #721c24;
}

.row {
  font-size: 13px;
  margin-bottom: 4px;
  line-height: 1.5;
}

.label {
  color: #777;
}

.loading {
  text-align: center;
  padding: 35px 20px;
  color: #666;
}

.spinner {
  margin: 10px auto;
  width: 30px;
  height: 30px;
  border: 4px solid #ddd;
  border-top: 4px solid #2196F3;
  border-radius: 50%;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  100% {
    transform: rotate(360deg);
  }
}

.backArea {
  padding: 10px;
}

.backBtn {
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: #666;
  color: white;
  font-size: 14px;
  font-weight: bold;
}

</style>
</head>

<body>

<div class="header">
  📖 日報履歴
</div>

<div id="count" class="count"></div>

<div id="app" class="container">

  <div class="loading">
    <div class="spinner"></div>
    履歴を読み込み中...
  </div>

</div>

<div class="backArea">
  <button
    class="backBtn"
    onclick="goBack()"
  >
    日報入力へ戻る
  </button>
</div>


<script>

let userId = "";

let isLoading = false;


/*
================================================
ここは現在使っているGAS URLにしてください
================================================
*/
const GAS_URL =
  "https://script.google.com/macros/s/AKfycbyzHeeJHueRUweeV1g0GNnXeAXeeYIFsaBNsL-YlW1JtQjJ9aDD34ra5EXiNjmj8R5IQA/exec";


/*
================================================
LIFF
index.htmlと同じLIFF ID
================================================
*/
const LIFF_ID =
  "2009609532-pYjsxOfo";


// ======================================================
// 初期化
// ======================================================

async function init() {

  try {

    await liff.init({
      liffId: LIFF_ID
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;
    }


    /*
    プロフィール取得はここで1回だけ
    */
    const profile =
      await liff.getProfile();


    userId =
      profile.userId || "";


    if (!userId) {

      throw new Error(
        "ユーザーIDを取得できませんでした"
      );
    }


    /*
    履歴取得
    */
    await loadHistory();


  } catch (err) {

    console.error(err);


    document
      .getElementById("app")
      .innerHTML =
      '<div class="loading">' +
      '履歴の読み込みに失敗しました。<br>' +
      'もう一度開き直してください。' +
      '</div>';
  }
}


// ======================================================
// 履歴取得
// ======================================================

async function loadHistory() {

  if (isLoading) {
    return;
  }


  isLoading = true;


  const app =
    document.getElementById(
      "app"
    );


  const count =
    document.getElementById(
      "count"
    );


  try {

    const url =
      GAS_URL +
      "?mode=myList&userId=" +
      encodeURIComponent(userId) +
      "&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const result =
      await response.json();


    if (
      result.status !== "OK"
    ) {

      throw new Error(
        result.message ||
        "履歴取得失敗"
      );
    }


    const data =
      Array.isArray(result.data)
        ? result.data
        : [];


    count.innerText =
      "表示件数：" +
      data.length +
      "件";


    renderHistory(
      data
    );


  } catch (err) {

    console.error(
      "履歴取得エラー",
      err
    );


    count.innerText =
      "";


    app.innerHTML =
      '<div class="loading">' +
      '履歴を取得できませんでした。' +
      '</div>';

  } finally {

    isLoading =
      false;
  }
}


// ======================================================
// 履歴描画
// ======================================================

function renderHistory(data) {

  const app =
    document.getElementById(
      "app"
    );


  if (
    !data ||
    data.length === 0
  ) {

    app.innerHTML =
      '<div class="loading">' +
      'まだ日報履歴はありません。' +
      '</div>';

    return;
  }


  /*
  HTMLを1件ずつ画面に追加せず、
  DocumentFragmentでまとめて描画
  */
  const fragment =
    document.createDocumentFragment();


  data.forEach(item => {

    const card =
      document.createElement(
        "div"
      );


    card.className =
      "card";


    const statusInfo =
      getStatusInfo(
        item.status
      );


    card.innerHTML = `

      <div class="top">

        <div class="date">
          ${escapeHtml(item.date)}
        </div>

        <div
          class="status ${statusInfo.className}"
        >
          ${escapeHtml(statusInfo.text)}
        </div>

      </div>


      <div class="row">

        <span class="label">
          区分：
        </span>

        ${escapeHtml(item.type)}

      </div>


      <div class="row">

        <span class="label">
          時間：
        </span>

        ${escapeHtml(item.start)}
        〜
        ${escapeHtml(item.end)}

      </div>


      <div class="row">

        <span class="label">
          現場：
        </span>

        ${escapeHtml(item.site)}

      </div>


      <div class="row">

        <span class="label">
          作業：
        </span>

        ${escapeHtml(item.work)}

      </div>


      <div class="row">

        <span class="label">
          連絡事項：
        </span>

        ${escapeHtml(item.note || "-")}

      </div>

    `;


    fragment.appendChild(
      card
    );
  });


  app.innerHTML =
    "";


  app.appendChild(
    fragment
  );
}


// ======================================================
// 承認状態
// ======================================================

function getStatusInfo(status) {

  const value =
    String(
      status || ""
    ).trim();


  if (
    value === "承認"
  ) {

    return {
      text: "承認済",
      className: "status-ok"
    };
  }


  if (
    value === "差戻し"
  ) {

    return {
      text: "差戻し",
      className: "status-reject"
    };
  }


  return {
    text: "未承認",
    className: "status-wait"
  };
}


// ======================================================
// HTMLエスケープ
// ======================================================

function escapeHtml(value) {

  return String(
    value ?? ""
  )
    .replace(
      /&/g,
      "&amp;"
    )
    .replace(
      /</g,
      "&lt;"
    )
    .replace(
      />/g,
      "&gt;"
    )
    .replace(
      /"/g,
      "&quot;"
    )
    .replace(
      /'/g,
      "&#039;"
    );
}


// ======================================================
// 戻る
// ======================================================

function goBack() {

  location.href =
    "index.html";
}


// ======================================================
// 起動
// ======================================================

init();

</script>

</body>
</html>
