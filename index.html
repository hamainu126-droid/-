<!DOCTYPE html>
<html>
<head>

<meta charset="utf-8">

<title>日報入力</title>

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
  background: #f5f5f5;
}

.header {
  background: #06C755;
  color: white;
  text-align: center;
  padding: 16px;
  font-size: 18px;
  font-weight: bold;
}

.container {
  padding: 15px;
  padding-bottom: 90px;
}

.card {
  background: white;
  border-radius: 16px;
  padding: 15px;
  box-shadow:
    0 2px 6px
    rgba(0, 0, 0, 0.05);
}

label {
  display: block;
  font-size: 12px;
  color: #777;
  margin-top: 2px;
}

input,
textarea,
select {

  width: 100%;

  padding: 12px;

  margin-top: 5px;
  margin-bottom: 12px;

  border-radius: 10px;

  border:
    1px solid #ddd;

  background: white;

  font-size: 16px;
}

textarea {
  min-height: 80px;
  resize: vertical;
}

input:disabled {
  background: #f7f7f7;
  color: #555;
}

select:disabled {
  background: #f5f5f5;
  color: #888;
}

.btn {

  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 12px;

  font-size: 15px;
  font-weight: bold;

  cursor: pointer;
}

.btn:disabled {
  opacity: 0.6;
}

.submit {
  background: #06C755;
  color: white;
}

.linkBtn {
  margin-top: 10px;
  background: #2196F3;
  color: white;
}

.loading {

  text-align: center;

  padding: 35px 20px;

  font-size: 14px;

  color: #666;
}

.spinner {

  margin: 10px auto;

  width: 30px;
  height: 30px;

  border:
    4px solid #ddd;

  border-top:
    4px solid #06C755;

  border-radius: 50%;

  animation:
    spin 1s linear infinite;
}

.smallSpinner {

  display: inline-block;

  width: 13px;
  height: 13px;

  margin-right: 5px;

  border:
    2px solid #ddd;

  border-top:
    2px solid #06C755;

  border-radius: 50%;

  vertical-align: middle;

  animation:
    spin 1s linear infinite;
}

@keyframes spin {

  100% {
    transform:
      rotate(360deg);
  }
}

.status {

  display: none;

  margin-bottom: 12px;

  padding: 9px;

  background: #f3fff7;

  border-radius: 8px;

  color: #555;

  font-size: 12px;
}

</style>

</head>

<body>

<div class="header">
  📋 日報入力
</div>


<div class="container">


  <div
    id="loading"
    class="loading"
  >

    <div class="spinner"></div>

    ユーザー情報取得中...

  </div>


  <div
    id="main"
    style="display:none;"
  >

    <div class="card">


      <div
        id="siteStatus"
        class="status"
      >

        <span
          class="smallSpinner"
        ></span>

        現場一覧を取得しています...

      </div>


      <label>
        日付
      </label>

      <input
        type="date"
        id="date"
      >


      <label>
        氏名（自動）
      </label>

      <input
        type="text"
        id="name"
        disabled
      >


      <label>
        勤務区分
      </label>

      <select id="type">

        <option value="昼勤">
          昼勤
        </option>

        <option value="夜勤">
          夜勤
        </option>

        <option value="休日">
          休日出勤
        </option>

      </select>


      <label>
        開始
      </label>

      <input
        type="time"
        id="start"
      >


      <label>
        終了
      </label>

      <input
        type="time"
        id="end"
      >


      <label>
        現場名
      </label>

      <select
        id="site"
        disabled
      >

        <option value="">
          読み込み中...
        </option>

      </select>


      <label>
        作業内容
      </label>

      <textarea
        id="work"
      ></textarea>


      <label>
        連絡事項
      </label>

      <textarea
        id="note"
      ></textarea>


      <button
        id="submitBtn"
        class="btn submit"
        onclick="sendData()"
      >
        送信する
      </button>


      <button
        class="btn linkBtn"
        onclick="goHistory()"
      >
        履歴を見る
      </button>


    </div>

  </div>

</div>


<script
  src="https://static.line-scdn.net/liff/edge/2/sdk.js"
></script>


<script>

let userId = "";

let userName = "";

let isReady = false;

let sitesReady = false;

let isSending = false;


const GAS_URL =
  "https://script.google.com/macros/s/AKfycbw5rSlFtifPqWwo3kpbkbydztYyacqHLetqsGvkfauJ9VMfReZ0EDHuh86VbM3ldD0kjg/exec";


// ======================================================
// 初期化
// ======================================================

window.onload = async () => {

  try {

    await liff.init({
      liffId:
        "2009609532-pYjsxOfo"
    });


    if (!liff.isLoggedIn()) {

      liff.login();

      return;
    }


    const profile =
      await liff.getProfile();


    userId =
      profile.userId || "";


    userName =
      profile.displayName || "";


    document
      .getElementById("name")
      .value =
      userName;


    // 日本時間で今日を設定
    document
      .getElementById("date")
      .value =
      getTodayJapan();


    // ===================================
    // ここが高速化のポイント
    // ===================================
    // 現場一覧を待たず先に画面表示
    // ===================================

    document
      .getElementById("loading")
      .style.display =
      "none";


    document
      .getElementById("main")
      .style.display =
      "block";


    isReady = true;


    // 現場一覧は後から取得
    loadSites();


  } catch (err) {

    console.error(err);


    document
      .getElementById("loading")
      .innerHTML =
      "ユーザー情報の取得に失敗しました。<br>" +
      "もう一度開き直してください。";
  }
};


// ======================================================
// 日本時間今日
// ======================================================

function getTodayJapan() {

  const now =
    new Date();


  const japan =
    new Date(
      now.toLocaleString(
        "en-US",
        {
          timeZone:
            "Asia/Tokyo"
        }
      )
    );


  const year =
    japan.getFullYear();


  const month =
    String(
      japan.getMonth() + 1
    ).padStart(
      2,
      "0"
    );


  const day =
    String(
      japan.getDate()
    ).padStart(
      2,
      "0"
    );


  return (
    year +
    "-" +
    month +
    "-" +
    day
  );
}


// ======================================================
// 現場一覧
// ======================================================

async function loadSites() {

  const select =
    document.getElementById(
      "site"
    );


  const status =
    document.getElementById(
      "siteStatus"
    );


  status.style.display =
    "block";


  select.disabled =
    true;


  try {

    const url =
      GAS_URL +
      "?mode=getSites&_=" +
      Date.now();


    const response =
      await fetch(
        url,
        {
          method: "GET",
          cache: "no-store"
        }
      );


    if (!response.ok) {

      throw new Error(
        "HTTP " +
        response.status
      );
    }


    const data =
      await response.json();


    if (
      !Array.isArray(data)
    ) {

      throw new Error(
        "現場データ形式エラー"
      );
    }


    select.innerHTML =
      '<option value="">選択してください</option>';


    data.forEach(site => {

      const option =
        document.createElement(
          "option"
        );


      option.value =
        site;


      option.textContent =
        site;


      select.appendChild(
        option
      );
    });


    select.disabled =
      false;


    sitesReady =
      true;


    status.style.display =
      "none";


  } catch (err) {

    console.error(
      "現場取得エラー",
      err
    );


    sitesReady =
      false;


    select.innerHTML =
      '<option value="">取得失敗・再読み込みしてください</option>';


    select.disabled =
      true;


    status.innerHTML =
      "⚠️ 現場一覧を取得できませんでした。";


    status.style.display =
      "block";
  }
}


// ======================================================
// 送信
// ======================================================

async function sendData() {

  if (!isReady) {

    alert(
      "ユーザー情報を読み込み中です。"
    );

    return;
  }


  if (!sitesReady) {

    alert(
      "現場一覧を読み込み中です。"
    );

    return;
  }


  if (isSending) {
    return;
  }


  const date =
    document.getElementById(
      "date"
    );


  const type =
    document.getElementById(
      "type"
    );


  const start =
    document.getElementById(
      "start"
    );


  const end =
    document.getElementById(
      "end"
    );


  const site =
    document.getElementById(
      "site"
    );


  const work =
    document.getElementById(
      "work"
    );


  const note =
    document.getElementById(
      "note"
    );


  if (!date.value) {

    alert(
      "日付は必須です"
    );

    return;
  }


  if (!type.value) {

    alert(
      "勤務区分は必須です"
    );

    return;
  }


  if (!start.value) {

    alert(
      "開始時間は必須です"
    );

    return;
  }


  if (!end.value) {

    alert(
      "終了時間は必須です"
    );

    return;
  }


  if (!site.value) {

    alert(
      "現場名は必須です"
    );

    return;
  }


  if (
    !work.value.trim()
  ) {

    alert(
      "作業内容は必須です"
    );

    return;
  }


  isSending =
    true;


  const button =
    document.getElementById(
      "submitBtn"
    );


  button.innerText =
    "送信中...";


  button.disabled =
    true;


  const params =
    new URLSearchParams();


  params.append(
    "mode",
    "save"
  );


  params.append(
    "date",
    date.value
  );


  params.append(
    "type",
    type.value
  );


  params.append(
    "start",
    start.value
  );


  params.append(
    "end",
    end.value
  );


  params.append(
    "site",
    site.value
  );


  params.append(
    "work",
    work.value.trim()
  );


  params.append(
    "note",
    note.value.trim()
  );


  params.append(
    "userId",
    userId
  );


  try {

    const response =
      await fetch(
        GAS_URL,
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/x-www-form-urlencoded;charset=UTF-8"
          },

          body:
            params.toString()
        }
      );


    const text =
      await response.text();


    let result;


    try {

      result =
        JSON.parse(text);

    } catch (err) {

      console.error(
        "JSON変換エラー",
        text
      );

      throw new Error(
        "サーバー応答エラー"
      );
    }


    if (
      result.status === "OK"
    ) {

      button.innerText =
        "送信完了！";


      setTimeout(() => {

        if (
          liff.isInClient()
        ) {

          liff.closeWindow();

        } else {

          button.innerText =
            "送信しました";
        }

      }, 600);


    } else {

      throw new Error(
        result.message ||
        "保存できませんでした"
      );
    }


  } catch (err) {

    console.error(
      err
    );


    alert(
      "送信失敗：" +
      err.message
    );


    button.innerText =
      "送信する";


    button.disabled =
      false;


    isSending =
      false;
  }
}


// ======================================================
// 履歴
// ======================================================

function goHistory() {

  location.href =
    "history.html";
}

</script>

</body>
</html>
